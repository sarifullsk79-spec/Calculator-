name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout project
        uses: actions/checkout@v5


      # --------------------------------
      # 2. Python
      # --------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # --------------------------------
      # 3. Java 17
      # --------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # 4. Linux packages
      # --------------------------------
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libncurses5-dev \
            gcc \
            g++


      # --------------------------------
      # 5. Python build tools
      # --------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "cython==0.29.37"

          python -m pip install "buildozer==1.5.0"


      # --------------------------------
      # 6. Create Android SDK
      # --------------------------------
      - name: Install Android SDK
        shell: bash
        run: |

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK ROOT:"
          echo "$SDK_ROOT"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Accepting Android licenses..."

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing Android packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "Android SDK installation complete."


      # --------------------------------
      # 7. Fix old Buildozer SDK path
      # --------------------------------
      - name: Fix Buildozer SDK paths
        shell: bash
        run: |

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK ROOT:"
          echo "$SDK_ROOT"

          echo "Checking SDK files..."

          ls -la "$SDK_ROOT" || true

          ls -la "$SDK_ROOT/cmdline-tools/latest/bin" || true

          # Buildozer 1.5.0 may search here:
          # android-sdk/tools/bin/sdkmanager

          mkdir -p "$SDK_ROOT/tools/bin"

          ln -sf \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"

          ln -sf \
            "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            "$SDK_ROOT/tools/bin/avdmanager"

          echo "sdkmanager fixed."

          echo "Testing sdkmanager..."

          "$SDK_ROOT/tools/bin/sdkmanager" --version


      # --------------------------------
      # 8. Android NDK
      # --------------------------------
      - name: Configure Android NDK
        shell: bash
        run: |

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "NDK configured."


      # --------------------------------
      # 9. Check Java / Android
      # --------------------------------
      - name: Check Android environment
        shell: bash
        run: |

          echo "======================"
          echo "JAVA"
          echo "======================"

          java -version

          echo ""
          echo "======================"
          echo "JAVAC"
          echo "======================"

          javac -version

          echo ""
          echo "======================"
          echo "ADB"
          echo "======================"

          adb version

          echo ""
          echo "======================"
          echo "SDKMANAGER"
          echo "======================"

          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo ""
          echo "======================"
          echo "NDK"
          echo "======================"

          ls -la "$ANDROID_NDK_HOME" || true


      # --------------------------------
      # 10. Check project files
      # --------------------------------
      - name: Check project
        shell: bash
        run: |

          echo "======================"
          echo "PROJECT FILES"
          echo "======================"

          ls -la

          echo ""
          echo "Checking main.py..."

          test -f main.py

          echo "main.py found."

          echo ""
          echo "Checking buildozer.spec..."

          test -f buildozer.spec

          echo "buildozer.spec found."

          echo ""
          echo "Requirements:"

          grep "^requirements" buildozer.spec || true


      # --------------------------------
      # 11. Clean old build
      # --------------------------------
      - name: Clean Buildozer
        shell: bash
        run: |

          rm -rf .buildozer
          rm -rf bin

          echo "Old build files removed."


      # --------------------------------
      # 12. Re-create SDK after clean
      # --------------------------------
      - name: Restore SDK after clean
        shell: bash
        run: |

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/tools/bin"

          # The SDK installed above may be removed by cleaning
          # only if it was inside project; this SDK is in HOME,
          # so normally it remains.

          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then

            ln -sf \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/tools/bin/sdkmanager"

            ln -sf \
              "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
              "$SDK_ROOT/tools/bin/avdmanager"

            echo "SDK path restored."

          else

            echo "ERROR: sdkmanager not found."

            exit 1

          fi


      # --------------------------------
      # 13. Build APK
      # --------------------------------
      - name: Build APK
        shell: bash
        run: |

          # Do not force clang globally.
          # python-for-android handles Android compiler itself.

          unset CC
          unset CXX
          unset CPP
          unset CFLAGS
          unset CXXFLAGS
          unset LDFLAGS

          echo "Starting Buildozer..."

          buildozer -v android debug


      # --------------------------------
      # 14. Find APK
      # --------------------------------
      - name: Check APK
        shell: bash
        run: |

          echo "======================"
          echo "BIN DIRECTORY"
          echo "======================"

          ls -lah bin || true

          echo ""
          echo "APK FILES:"

          find bin -type f -name "*.apk" -print


      # --------------------------------
      # 15. Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error￼Enter
