name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Download project
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. System packages
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5 \
            libncurses5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # 5. Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install "cython==0.29.37"

          pip install "buildozer==1.5.0"

      # 6. Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp

          echo "Downloading Android command line tools..."

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          echo "Extracting..."

          unzip -q commandlinetools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mv cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Checking sdkmanager..."

          test -f "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 7. Android NDK 25b
      - name: Install Android NDK 25b
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Installing NDK 25b..."

          "$SDKMANAGER" "ndk;25.2.9519653"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      # 8. SDK compatibility
      - name: Prepare SDK compatibility
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "SDK manager:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

          echo "Android build tools:"
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

      # 9. Check Java
      - name: Check Java
        run: |
          java -version
          javac -version

      # 10. Check project
      - name: Check project files
        shell: bash
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          ls -la

          echo "=============================="
          echo "buildozer.spec"
          echo "=============================="

          test -f buildozer.spec

          cat buildozer.spec

          echo "=============================="
          echo "main.py"
          echo "=============================="

          test -f main.py

          head -30 main.py

      # 11. Clean previous build
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 12. Build APK
      - name: Build Android APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        shell: bash
        run: |
          set -e

          echo "Starting Buildozer..."

          buildozer -v android debug

      # 13. Find APK
      - name: Find APK
        if: always()
        run: |
          echo "=============================="
          echo "APK FILES"
          echo "=============================="

          find . -type f -name "*.apk" -print || true

      # 14. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error￼Entername: Build Android APK

