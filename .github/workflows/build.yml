name: Build Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget curl
          sudo apt-get install -y autoconf automake libtool pkg-config
          sudo apt-get install -y cmake libffi-dev libssl-dev zlib1g-dev
          sudo apt-get install -y libsqlite3-dev libbz2-dev liblzma-dev
          sudo apt-get install -y libreadline-dev libncurses5-dev gcc g++

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==0.29.37"
          python -m pip install "buildozer==1.5.0"

      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd /tmp

          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O sdk.zip

          unzip -q sdk.zip

          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Fix SDK path
        shell: bash
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/tools/bin"

          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$SDK_ROOT/tools/bin/avdmanager"

          "$SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Check project
        shell: bash
        run: |
          test -f main.py
          test -f buildozer.spec

          echo "main.py OK"
          echo "buildozer.spec OK"

          grep "^requirements" buildozer.spec || true

      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |
          unset CC
          unset CXX
          unset CPP
          unset CFLAGS
          unset CXXFLAGS
          unset LDFLAGS

          buildozer -v android debug

      - name: Show APK
        shell: bash
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
