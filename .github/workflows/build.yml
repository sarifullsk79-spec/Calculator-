name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Download project
      - name: Checkout project
        uses: actions/checkout@v5

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install system packages
      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libncurses5-dev \
            gcc \
            g++

      # 5. Install Python build tools
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.37"
          python -m pip install "buildozer==1.5.0"

      # 6. Android SDK
      - name: Install Android SDK
        shell: bash
        run: |

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mv cmdline-tools "$SDK_ROOT/cmdline-tools/latest"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 7. Check Android tools
      - name: Check Android environment
        shell: bash
        run: |
          echo "JAVA:"
          java -version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "AIDL:"
          "$ANDROID_HOME/build-tools/35.0.0/aidl" --help >/dev/null || true

      # 8. Clean old Buildozer files
      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 9. Check project files
      - name: Check project
        shell: bash
        run: |
          echo "Project files:"
          ls -la

          echo ""
          echo "buildozer.spec:"
          test -f buildozer.spec

          echo ""
          echo "main.py:"
          test -f main.py

      # 10. Build APK
      - name: Build APK
        shell: bash
        run: |
          unset CC
          unset CXX
          unset CPP
          unset CFLAGS
          unset CXXFLAGS
          unset LDFLAGS

          buildozer -v android debug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
